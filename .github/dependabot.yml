---
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: uv
    # The bundled Literalizer wheel is refreshed with the browser assets.
    ignore:
      - dependency-name: literalizer
    allow:
      - dependency-type: all
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10

  # Dependabot cannot read prek.toml yet:
  # https://github.com/dependabot/dependabot-core/issues/14624
