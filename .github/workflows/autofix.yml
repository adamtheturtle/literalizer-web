---
name: autofix.ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install Node dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Install Python tools
        run: uv sync --frozen --group=dev
      - name: Run fixers
        run: uv run prek run --all-files --hook-stage pre-commit --no-fail-fast --verbose
      - uses: autofix-ci/action@v1.3.4
        if: always()
