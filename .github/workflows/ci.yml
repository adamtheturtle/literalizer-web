---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 0 1 * * *
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --frozen --group=dev
      - name: Test browser bridge
        run: uv run pytest

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check generated highlighter
        run: npm run check:generated
      - name: Run JavaScript tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e

  completion-ci:
    needs: [bridge, browser, javascript]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test status
        run: |-
          if ! ${{ needs.bridge.result == 'success' && needs.browser.result == 'success' && needs.javascript.result == 'success' }}; then
            echo "One or more test jobs failed"
            exit 1
          fi
