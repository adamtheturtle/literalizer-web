[project]
name = "literalizer-web"
version = "0.0.0"
description = "Browser-based interface for Literalizer"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Adam Dangoor", email = "adamdangoor@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []
urls.Source = "https://github.com/adamtheturtle/literalizer-web"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "karva==0.0.1a13",
    "literalizer==2026.9.16",
    "mypy==2.4.0",
    "prek==0.5.7",
    "pyproject-fmt==2.30.3",
    "ruff==0.17.2",
    "shellcheck-py==0.11.0.1",
    "snapper-fmt==0.11.10",
    "vale==3.22.0.0",
    "yamlfix==1.19.1",
    "zizmor==1.31.1",
]

[tool.uv]
# Dependabot currently ships uv 0.12.18; CI pins uv separately.
required-version = ">=0.12.18"
dependency-groups.dev = { requires-python = "<3.16" }
sources.literalizer = { path = "dist/literalizer-2026.9.16-py3-none-any.whl" }
package = false

[tool.ruff]
line-length = 100
lint.select = [ "B", "E", "F", "I", "RUF", "S", "SIM", "UP" ]
lint.ignore = [
    "E501",
]
lint.per-file-ignores."tests/**/test_*.py" = [
    "S101",
]
lint.unfixable = [ "ERA001" ]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.15"

[tool.mypy]
mypy_path = "dist"
files = [ "dist/bridge.py", "tests/python" ]
show_traceback = true

[tool.karva]
profile.default.src.include = [ "tests/python" ]

[tool.yamlfix]
section_whitelines = 1
whitelines = 1
