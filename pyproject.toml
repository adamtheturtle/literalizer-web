[project]
name = "literalizer-web"
version = "0.0.0"
description = "Browser-based interface for Literalizer"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Adam Dangoor", email = "adamdangoor@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
urls.Source = "https://github.com/adamtheturtle/literalizer-web"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.24",
    "literalizer",
    "prek==0.5.3",
    "pyproject-fmt==2.29.4",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "shellcheck-py==0.11.0.1",
    "snapper-fmt==0.11.5",
    "vale==3.22.0.0",
    "yamlfix==1.19.1",
    "zizmor==1.30.1",
]

[tool.uv]
required-version = "==0.11.7"
sources.literalizer = { path = "dist/literalizer-2026.9.4.post548+gf41d2a15b-py3-none-any.whl" }
package = false

[tool.ruff]
line-length = 100
lint.select = [ "B", "E", "F", "I", "RUF", "S", "SIM", "UP" ]
lint.ignore = [
    "E501",
]
lint.per-file-ignores."tests/**/test_*.py" = [
    "S101",
]
lint.unfixable = [ "ERA001" ]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.14"

[tool.pytest]
ini_options.testpaths = [ "tests/python" ]
ini_options.xfail_strict = true

[tool.yamlfix]
section_whitelines = 1
whitelines = 1
